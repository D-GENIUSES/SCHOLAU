name: Database migration and security tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Apply migrations and run pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: "2.84.2"
      - name: Start disposable local Supabase
        run: supabase start
      - name: Reapply all migrations in clean local database
        run: supabase db reset --local
      - name: Inventory security failures
        run: |
          docker exec -i supabase_db_scholau psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          select n.nspname as schema, c.relname as table_name
          from pg_class c join pg_namespace n on n.oid=c.relnamespace
          where c.relkind in ('r','p') and n.nspname in ('public','private') and not c.relrowsecurity;
          select p.oid::regprocedure as function_name, r.role
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          cross join (values ('anon'),('authenticated')) r(role)
          where n.nspname='private' and has_function_privilege(r.role,p.oid,'EXECUTE');
          select p.oid::regprocedure as function_name
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and has_function_privilege('anon',p.oid,'EXECUTE')
            and p.proname like '%\_v1';
          SQL
      - name: Execute database security and regression tests
        run: supabase test db
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
