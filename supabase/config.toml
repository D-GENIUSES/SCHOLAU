# Supabase CLI configuration for ScholAu (local development).
# Hosted projects are configured in the dashboard / via `supabase link` + `supabase config push`.

project_id = "scholau"

[api]
enabled = true
port = 54321
# Only public RPCs/tables are exposed through the Data API. The `private` and `authz` schemas are
# intentionally NOT listed and must never be added here.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Local development fixtures only (D01: no fabricated content ships to production).
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.email]
# D03: email/password with verification and recovery.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[functions.push-delivery]
verify_jwt = false # Dedicated x-push-worker-secret verified inside the handler.
